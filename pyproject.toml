[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "YiImageBig"
version = "0.0.3-beta"
description = "AI-powered image & video upscaling tool supporting NVIDIA GPU, Intel GPU/NPU, and CPU"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "YiImageBig"}
]
keywords = ["ai", "upscale", "super-resolution", "realesrgan", "openvino", "onnxruntime", "npu", "gpu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "PySide6>=6.5.0",
    "opencv-python>=4.8.0",
    "openvino>=2025.0.0",
    "onnxruntime-directml>=1.24.0",
    "numpy>=1.24.0",
    "psutil>=5.9.0",
]

[project.urls]
Homepage = "https://github.com/YiImageBig/YiImageBig"
Repository = "https://github.com/YiImageBig/YiImageBig"

[project.scripts]
yiimagebig = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.xml", "*.bin", "*.onnx", "*.pth"]
